<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SEC Transactions Tracker</title>
    <meta name="description" content="An offline-first corporate compliance and filing management application for Philippine SEC transactions, fees, itemized expenses, and balance tracking." />
    <meta property="og:title" content="SEC Transactions Tracker" />
    <meta property="og:description" content="An offline-first corporate compliance and filing management application for Philippine SEC transactions, fees, itemized expenses, and balance tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Settings -->
    <meta name="application-name" content="SEC Tracker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SEC Tracker" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Static Apple Touch & PWA Icon Links -->
    <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link id="appleTouchPrecomposed" rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png" />
    <link id="appFavicon" rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link id="appManifest" rel="manifest" href="./manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- High-Resolution Canvas Icon Generator & Dynamic Link Injector -->
    <script>
      (function generateHeaderMatchedAppIcon() {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          var ctx = canvas.getContext('2d');
          if (!ctx) return;

          // 1. Light Blue Background Gradient matching Header Icon
          var bg = ctx.createLinearGradient(0, 0, 512, 512);
          bg.addColorStop(0, '#48caff');
          bg.addColorStop(0.5, '#38bdf8');
          bg.addColorStop(1, '#0ea5e9');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, 512, 512);

          // 2. Soft Radial Highlight
          var glow = ctx.createRadialGradient(235, 235, 20, 235, 235, 280);
          glow.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
          glow.addColorStop(1, 'rgba(14, 165, 233, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(235, 235, 280, 0, Math.PI * 2);
          ctx.fill();

          // 3. White Book with Drop Shadow
          ctx.save();
          ctx.shadowColor = 'rgba(3, 105, 161, 0.32)';
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 12;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(102, 112, 256, 308, [34]);
          ctx.fill();
          ctx.restore();

          // Book Spine Line on Left
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(140, 114);
          ctx.lineTo(140, 418);
          ctx.stroke();

          // Bottom Page Thickness Detail
          ctx.fillStyle = '#bae6fd';
          ctx.beginPath();
          ctx.roundRect(130, 394, 210, 14, [7]);
          ctx.fill();

          // Horizontal Writing Lines on the Book
          ctx.strokeStyle = '#0ea5e9';
          ctx.lineWidth = 12;
          ctx.lineCap = 'round';
          var lineYs = [180, 221, 262, 302, 343];
          var lineMaxXs = [312, 312, 286, 246, 220];
          for (var i = 0; i < lineYs.length; i++) {
            ctx.beginPath();
            ctx.moveTo(168, lineYs[i]);
            ctx.lineTo(lineMaxXs[i], lineYs[i]);
            ctx.stroke();
          }

          // 4. White Pencil Writing on the Book (Rotated -45 deg around tip at 248, 302)
          ctx.save();
          ctx.translate(248, 302);
          ctx.rotate(-Math.PI / 4);

          // Pencil Shadow
          ctx.save();
          ctx.fillStyle = 'rgba(2, 132, 199, 0.28)';
          ctx.beginPath();
          ctx.roundRect(24, 6, 175, 44, [12]);
          ctx.fill();
          ctx.restore();

          // Light Blue Halo around Pencil so White Pencil stands out over White Book
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath();
          ctx.moveTo(-10, 0);
          ctx.lineTo(38, -30);
          ctx.lineTo(182, -30);
          ctx.quadraticCurveTo(196, -30, 196, -16);
          ctx.lineTo(196, 16);
          ctx.quadraticCurveTo(196, 30, 182, 30);
          ctx.lineTo(38, 30);
          ctx.closePath();
          ctx.fill();

          // Main White Pencil Shaft
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(38, -21, 114, 42, [4]);
          ctx.fill();

          // Subtle Shaft Center Ridge
          ctx.strokeStyle = '#bae6fd';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(45, 0);
          ctx.lineTo(145, 0);
          ctx.stroke();

          // Ferrule Band
          ctx.fillStyle = '#7dd3fc';
          ctx.fillRect(152, -21, 14, 42);

          // White Eraser Cap
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(166, -21, 20, 42, [0, 10, 10, 0]);
          ctx.fill();

          // White Pencil Cone Tip
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(38, -21);
          ctx.lineTo(38, 21);
          ctx.closePath();
          ctx.fill();

          // Graphite Point Nib
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(17, -9.5);
          ctx.lineTo(17, 9.5);
          ctx.closePath();
          ctx.fill();

          ctx.restore();

          // Export high-resolution PNG data URL
          var iconDataUrl = canvas.toDataURL('image/png');

          // Dynamically bind to Apple touch icon links and favicon
          var appleIcon = document.getElementById('appleTouchIcon');
          var applePre = document.getElementById('appleTouchPrecomposed');
          var fav = document.getElementById('appFavicon');
          if (appleIcon) appleIcon.href = iconDataUrl;
          if (applePre) applePre.href = iconDataUrl;
          if (fav) fav.href = iconDataUrl;

          // Update dynamic data URI manifest fallback
          var manifestLink = document.getElementById('appManifest');
          if (manifestLink) {
            var manifestObj = {
              id: "./",
              name: "SEC Transactions Tracker",
              short_name: "SEC Tracker",
              start_url: "./",
              scope: "./",
              display: "standalone",
              orientation: "any",
              background_color: "#0f172a",
              theme_color: "#38bdf8",
              description: "An offline-first corporate compliance and filing management application for Philippine SEC transactions, fees, itemized expenses, and balance tracking.",
              icons: [
                { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "any" },
                { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "maskable" },
                { src: iconDataUrl, sizes: "180x180", type: "image/png" }
              ]
            };
            manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
          }
        } catch (e) {
          console.warn('Canvas PWA Icon initialization fallback:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
